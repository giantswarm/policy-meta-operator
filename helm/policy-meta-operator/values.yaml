name: policy-meta-operator
serviceType: managed

global:
  image:
    registry: "gsoci.azurecr.io"

# @schema enum:["", amd64, arm64]
# -- CPU architecture of nodes to schedule on; empty means any.
architecture: ""

# -- Node selector for pod scheduling. Merged with `architecture`.
nodeSelector: {}  # @schema additionalProperties: true

# -- Tolerations for pod scheduling
tolerations: []

# Pod securityContext
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container securityContext
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 220Mi
  limits:
    cpu: 100m
    memory: 220Mi

image:
  registry: gsoci.azurecr.io
  name: giantswarm/policy-meta-operator
  tag: ""  # Defaults to Chart.AppVersion if empty
  pullPolicy: IfNotPresent

edgedb:
  host: edgedb
  port: 5656
  user: edgedb
  passwordSecret:
    name: edgedb-server-password
  tlsSecret:
    name: edgedb-tls
